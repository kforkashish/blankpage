
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIM Design Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#050505;color:white;
  font-family:Arial,sans-serif;text-align:center
}
header{padding:25px 10px}
h1{color:#e7c46d;letter-spacing:5px}
p{color:#aaa}
.hero{
  min-height:300px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:radial-gradient(circle,#30200b,#050505 70%)
}
.big{
  font-size:clamp(100px,25vw,190px);
  font-weight:900;letter-spacing:-12px;
  background:linear-gradient(135deg,#fff4bd,#bd862b,#fff0a5);
  -webkit-background-clip:text;color:transparent;
  animation:spin 7s linear infinite
}
@keyframes spin{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(360deg)}
}
.gallery{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:13px;padding:15px;max-width:1000px;margin:auto
}
.card{
  min-height:145px;border:1px solid #302819;border-radius:14px;
  background:linear-gradient(145deg,#17130d,#080808);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer
}
.card:hover{border-color:#e7c46d;transform:translateY(-3px)}
.word{font-size:42px;font-weight:900;letter-spacing:-3px}
.name{font-size:11px;color:#aaa;margin-top:15px}
.royal{color:#f0ce70;text-shadow:0 0 15px #bd842b;font-family:Georgia}
.calligraphy{font-family:cursive;font-style:italic;color:#f5e7d0}
.cartoon{color:#ffdf39;text-shadow:3px 4px #ec3981}
.king{color:#e8cb79;text-shadow:0 0 12px gold}
.metal{color:#ddd;text-shadow:2px 3px #666,0 0 15px white}
.anime{color:#9beaff;text-shadow:0 0 15px #168cff}
.graffiti{color:#ff613d;text-shadow:3px 3px #9b31c7}
.neon{color:white;text-shadow:0 0 8px cyan,0 0 22px blue}
.floral{color:#f2a9c7;font-family:Georgia}
.fire{color:#ff8b28;text-shadow:0 0 15px red,0 0 25px orange}
.minimal{color:#eee;font-weight:300;letter-spacing:8px}
.gothic{font-family:Georgia;color:#bbb;text-shadow:0 0 12px #888}
.ice{color:#a9f5ff;text-shadow:0 0 15px #42dfff}
.warrior{color:#d4ad63;text-shadow:3px 3px #555}
.signature{font-family:cursive;font-style:italic;color:#f2e3c2}
#passwordScreen{
  position:fixed;inset:0;background:#050505;z-index:99999;
  display:flex;align-items:center;justify-content:center;padding:20px
}
.login{
  width:100%;max-width:360px;padding:30px 24px;
  border:1px solid #b99548;border-radius:18px;background:#111
}
#sitePassword{
  width:100%;padding:14px;margin:15px 0;
  background:#050505;color:white;border:1px solid #b99548;
  border-radius:8px
}
button{
  padding:12px 17px;margin:6px;border-radius:25px;
  border:1px solid #b99548;background:#111;color:#f5d98c;
  cursor:pointer
}
.login button{width:100%;background:#d7b66a;color:#080808;font-weight:bold}
#passwordError{color:#ff7070;font-size:13px}
#preview{display:none;padding:25px}
#large{font-size:clamp(70px,18vw,140px)}
footer{padding:30px;color:#777;font-size:12px}
</style>
</head>

<body>

<!-- PASSWORD SCREEN -->
<div id="passwordScreen">
  <div class="login">
    <h1>RIM</h1>
    <p>PRIVATE ACCESS</p>
    <input id="sitePassword" type="password"
      placeholder="Enter password" autocomplete="current-password">
    <button onclick="unlockPage()">UNLOCK</button>
    <p id="passwordError"></p>
  </div>
</div>

<!-- MAIN PAGE -->
<header>
  <h1>RIM DESIGN STUDIO</h1>
  <p>ONE WORD. UNLIMITED STYLES.</p>
</header>

<section class="hero">
  <div class="big">RIM</div>
  <p>Choose your style. Create your identity.</p>
  <button onclick="document.getElementById('designs').scrollIntoView({behavior:'smooth'})">
    EXPLORE DESIGNS ↓
  </button>
</section>

<h2 id="designs" style="color:#e7c46d">THE DESIGN COLLECTION</h2>
<p>Click any design to preview.</p>
<div class="gallery" id="gallery"></div>

<section id="preview">
  <h2 id="previewName" style="color:#e7c46d"></h2>
  <div id="large"></div>
  <p id="promptText"></p>
  <button onclick="copyPrompt()">COPY DESIGN PROMPT</button>
  <button onclick="closePreview()">CLOSE</button>
</section>

<footer>RIM DESIGN STUDIO</footer>

<script>
const styles=[
 ["Royal Luxury","royal","Golden royal lettering, crown, diamonds and black velvet"],
 ["Calligraphy","calligraphy","Elegant flowing handwritten ink lettering"],
 ["Cartoon","cartoon","Cute colourful cartoon lettering"],
 ["King & Queen","king","Majestic crown, throne and royal jewels"],
 ["3D Metallic","metal","Reflective silver chrome 3D letters"],
 ["Anime Fantasy","anime","Magical blue energy and fantasy sparks"],
 ["Graffiti","graffiti","Urban spray paint and bold outlines"],
 ["Neon Cyberpunk","neon","Electric cyan neon tubes on black"],
 ["Floral","floral","Roses, vines and delicate leaves"],
 ["Fire","fire","Molten orange flames and glowing embers"],
 ["Minimalist","minimal","Clean white typography and premium spacing"],
 ["Dark Gothic","gothic","Mysterious gothic silver lettering"],
 ["Fire & Ice","ice","Frosted crystal letters with icy glow"],
 ["Fantasy Warrior","warrior","Ancient metal, swords and glowing runes"],
 ["Signature","signature","Personal handwritten signature lettering"]
];

const gallery=document.getElementById("gallery");
let selected=null;

styles.forEach((s,i)=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML='<div class="word '+s[1]+'">RIM</div>'+
    '<div class="name">'+(i+1)+'. '+s[0]+'</div>';
  card.onclick=()=>openPreview(s);
  gallery.appendChild(card);
});

function unlockPage(){
  const password=document.getElementById("sitePassword").value;
  if(password==="RIM123"){
    document.getElementById("passwordScreen").style.display="none";
    sessionStorage.setItem("rimUnlocked","yes");
  }else{
    document.getElementById("passwordError").textContent="Wrong password. Try again.";
  }
}

document.getElementById("sitePassword").addEventListener("keydown",e=>{
  if(e.key==="Enter") unlockPage();
});

if(sessionStorage.getItem("rimUnlocked")==="yes"){
  document.getElementById("passwordScreen").style.display="none";
}

function openPreview(s){
  selected=s;
  document.getElementById("preview").style.display="block";
  document.getElementById("previewName").textContent=s[0];
  const large=document.getElementById("large");
  large.className="word "+s[1];
  large.textContent="RIM";
  document.getElementById("promptText").textContent=
    "Design prompt: Exact word RIM. "+s[2]+". Premium, readable typography.";
  document.getElementById("preview").scrollIntoView({behavior:"smooth"});
}
function closePreview(){
  document.getElementById("preview").style.display="none";
}
function copyPrompt(){
  if(!selected)return;
  const text="Create typography with the exact word RIM. Style: "+
    selected[0]+". "+selected[2]+". Keep letters readable.";
  navigator.clipboard.writeText(text)
    .then(()=>alert("Prompt copied!"))
    .catch(()=>alert(text));
}
</script>

</body>
</html>
