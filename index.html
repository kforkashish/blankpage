
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .rim {
            font-size: clamp(70px, 18vw, 180px);
            font-weight: 900;
            letter-spacing: 12px;
            color: #ffffff;
            text-shadow: 0 0 20px #ffffff55;
            animation: rotateRIM 4s linear infinite;
        }

        @keyframes rotateRIM {
            from {
                transform: rotateY(0deg);
            }
            to {
                transform: rotateY(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="rim">RIM</div>
</body>
</html>
